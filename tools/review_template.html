<title>בדיקת פתרונות חדו״א 1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: one reading column of solution cards under a sticky progress-and-filter bar; matches the practice app's palette */
:root {
  --paper: #f6f8fb;
  --sheet: #ffffff;
  --ink: #1b2433;
  --muted: #5b6678;
  --line: #d9dfe8;
  --accent: #2348a8;
  --accent-soft: #e6ecfa;
  --solution: #fdf6dc;
  --solution-line: #eadcaa;
  --good: #1e6b3a;
  --good-soft: #eef6f0;
  --warn: #8a5a00;
  --warn-soft: #fbf3e2;
  --bad: #a3271f;
  --bad-soft: #fbeceb;
  --fix: #5a3fa0;
  --fix-soft: #f0ebfa;
  --font: "Assistant", "Arial Hebrew", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #12161e; --sheet: #1a202b; --ink: #e4e9f1; --muted: #9aa5b8; --line: #2d3545;
    --accent: #8eaaf5; --accent-soft: #232e48; --solution: #26221a; --solution-line: #423a26;
    --good: #8fd6a6; --good-soft: #17291f; --warn: #e5bf6e; --warn-soft: #2c2414;
    --bad: #f19a92; --bad-soft: #351a18; --fix: #c3b0f5; --fix-soft: #261f3a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #12161e; --sheet: #1a202b; --ink: #e4e9f1; --muted: #9aa5b8; --line: #2d3545;
  --accent: #8eaaf5; --accent-soft: #232e48; --solution: #26221a; --solution-line: #423a26;
  --good: #8fd6a6; --good-soft: #17291f; --warn: #e5bf6e; --warn-soft: #2c2414;
  --bad: #f19a92; --bad-soft: #351a18; --fix: #c3b0f5; --fix-soft: #261f3a;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.6; margin: 0; padding-inline: 16px; }
.wrap { max-width: 820px; margin: 0 auto; padding-block: 0 64px; display: grid; gap: 16px; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper);
  padding-block: 14px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 10px;
}
.bar h1 { margin: 0; font-size: 1.35rem; line-height: 1.2; text-wrap: balance; }
.progress { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
.progress span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.85rem; color: var(--muted); }
.legend b { color: var(--ink); font-variant-numeric: tabular-nums; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-inline-end: 5px; vertical-align: baseline; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
select, button, textarea { font: inherit; color: inherit; }
select { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); }
.count { font-size: 0.85rem; color: var(--muted); margin-inline-start: auto; }
.banner { padding: 10px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-weight: 600; }

.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: grid; gap: 12px; min-width: 0; }
.card[data-status="ok"] { border-color: var(--good); }
.card[data-status="problem"] { border-color: var(--bad); }
.card[data-status="fixed"] { border-color: var(--fix); }
.head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.head h2 { margin: 0; font-size: 1.05rem; }
.head small { color: var(--muted); font-weight: 600; }
.chip { font-size: 0.8rem; padding: 0 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.pre { border-radius: 8px; padding: 8px 12px; font-size: 0.92rem; }
.pre b { display: block; font-size: 0.8rem; letter-spacing: 0.02em; }
.pre.wrong { background: var(--bad-soft); color: var(--bad); }
.pre.check { background: var(--warn-soft); color: var(--warn); }
.pre .fixline { margin-top: 4px; }
.auto { font-size: 0.8rem; color: var(--muted); }
.qtext { overflow-wrap: anywhere; }
.qtext p { margin: 0 0 0.4em; }
.card img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; background: #fff; justify-self: start; }
.options { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.options li { display: flex; gap: 8px; align-items: baseline; padding: 2px 8px; border-radius: 6px; border: 1px solid transparent; }
.options li.correct { background: var(--good-soft); color: var(--good); border-color: currentColor; }
.options .letter { font-weight: 700; min-width: 1.2em; }
.note { font-size: 0.85rem; color: var(--muted); }
.solution { background: var(--solution); border: 1px solid var(--solution-line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.solution ol { margin: 0; padding-inline-start: 1.6em; display: grid; gap: 6px; }
.solution li::marker { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.answer { background: var(--good-soft); color: var(--good); border-radius: 6px; padding: 6px 12px; font-weight: 600; }
.claude { background: var(--fix-soft); color: var(--fix); border-radius: 8px; padding: 8px 12px; font-size: 0.92rem; }
.claude b { display: block; font-size: 0.8rem; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.act { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-weight: 700; }
.act:hover { background: var(--accent-soft); }
.act[data-s="ok"][aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--sheet); }
.act[data-s="problem"][aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: var(--sheet); }
.act[data-s="unsure"][aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: var(--sheet); }
.act:disabled { opacity: 0.5; cursor: default; }
.saved { font-size: 0.8rem; color: var(--muted); }
textarea { width: 100%; min-height: 2.6em; resize: vertical; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--paper); }
.more { justify-self: center; border: 1px solid var(--line); background: var(--sheet); border-radius: 6px; padding: 8px 16px; cursor: pointer; font-weight: 600; }
.empty { text-align: center; color: var(--muted); padding: 32px 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
mjx-container { direction: ltr; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
@media (max-width: 480px) { .card { padding: 14px; } .count { margin-inline-start: 0; flex-basis: 100%; } }
</style>

<div class="wrap" dir="rtl" lang="he">
  <header class="bar">
    <h1>בדיקת פתרונות חדו״א 1</h1>
    <div class="progress" id="progress" aria-hidden="true"></div>
    <div class="legend" id="legend"></div>
    <div class="filters">
      <label for="f-status" hidden>מצב</label>
      <select id="f-status">
        <option value="todo">טרם נבדקו</option>
        <option value="flagged">טרם נבדקו, סומנו בבדיקה האוטומטית</option>
        <option value="problem">סימנתי „יש בעיה”</option>
        <option value="unsure">סימנתי „לא בטוח”</option>
        <option value="fixed">תוקנו, לבדיקה חוזרת</option>
        <option value="ok">אישרתי</option>
        <option value="all">הכול</option>
      </select>
      <label for="f-topic" hidden>נושא</label>
      <select id="f-topic"></select>
      <span class="count" id="count"></span>
    </div>
  </header>
  <div class="banner" id="banner" hidden>השמירה לא זמינה בתצוגה הזו, ולכן אפשר לעיין בפתרונות אבל לא לסמן אותם.</div>
  <main id="list" class="wrap" style="padding:0"></main>
</div>

<script type="application/json" id="data">/*__DATA__*/</script>
<script>
window.MathJax = {
  tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["\\[", "\\]"]] },
  svg: { fontCache: "global" },
  startup: { typeset: false, ready() { MathJax.startup.defaultReady(); MathJax.startup.promise.then(() => typesetQueue.splice(0).forEach(typeset)); } }
};
const typesetQueue = [];
function typeset(el) {
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]).catch(() => {});
  else typesetQueue.push(el);
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg-full.js" async></script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const ITEMS = D.items;
const LETTERS = ["א", "ב", "ג", "ד", "ה", "ו", "ז", "ח", "ט", "י"];
const PAGE = 20;
const STATUS = {
  ok: { label: "אישרתי", color: "var(--good)" },
  problem: { label: "יש בעיה", color: "var(--bad)" },
  unsure: { label: "לא בטוח", color: "var(--warn)" },
  fixed: { label: "תוקנו, לבדיקה חוזרת", color: "var(--fix)" },
  todo: { label: "טרם נבדקו", color: "var(--line)" },
};
let reviews = {};          // question id -> stored review
let db = null;
const cards = new Map();   // question id -> card element on screen
const BY_ID = new Map(ITEMS.map(i => [i.id, i]));
const writing = new Map(); // question id -> pending write chain (one write at a time per doc)

const $ = id => document.getElementById(id);
const statusOf = id => (reviews[id] && reviews[id].status) || "todo";
function el(tag, cls, htmlText) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (htmlText !== undefined) e.innerHTML = htmlText;
  return e;
}

$("f-topic").append(new Option("כל הנושאים", ""), ...D.topics.filter(t => ITEMS.some(i => i.topic === t)).map(t => new Option(t, t)));

function renderProgress() {
  const n = { ok: 0, problem: 0, unsure: 0, fixed: 0, todo: 0 };
  ITEMS.forEach(i => { n[statusOf(i.id)] = (n[statusOf(i.id)] || 0) + 1; });
  $("progress").replaceChildren(...["ok", "fixed", "unsure", "problem"].map(k => {
    const s = el("span"); s.style.width = (100 * n[k] / ITEMS.length) + "%"; s.style.background = STATUS[k].color; return s;
  }));
  $("legend").innerHTML = ["ok", "problem", "unsure", "fixed", "todo"].map(k =>
    `<span><i style="background:${STATUS[k].color}"></i>${STATUS[k].label} <b>${n[k]}</b></span>`).join("") +
    `<span>מתוך <b>${ITEMS.length}</b></span>`;
}

function matches(it) {
  const f = $("f-status").value, t = $("f-topic").value, s = statusOf(it.id);
  if (t && it.topic !== t) return false;
  if (f === "all") return true;
  if (f === "flagged") return s === "todo" && (it.pre === "wrong" || it.pre === "check");
  return s === f;
}

function card(it) {
  const c = el("article", "card");
  c.dataset.status = statusOf(it.id);
  const pts = it.points ? ` · ${it.points} נק׳` : "";
  const head = el("div", "head", `<h2>${it.exam}</h2><small>שאלה ${it.number}${pts}</small>`);
  head.append(el("span", "chip", it.topic), el("span", "chip", it.sub));
  c.append(head);
  if (it.pre === "wrong" || it.pre === "check") {
    const p = el("div", "pre " + it.pre, `<b>${it.pre === "wrong" ? "חשד לטעות (בדיקה אוטומטית)" : "לבדוק בעיון (בדיקה אוטומטית)"}</b>${it.preReason}`);
    if (it.preFix) p.append(el("div", "fixline", "הצעה: " + it.preFix));
    c.append(p);
  } else if (it.pre === "ok") {
    c.append(el("div", "auto", "הבדיקה האוטומטית לא מצאה בעיה בתוצאה. היא לא מחליפה קריאה של הנימוקים."));
  }
  c.append(el("div", "qtext", it.text));
  if (it.image && D.images[it.image]) { const img = el("img"); img.src = D.images[it.image]; img.alt = "איור מתוך השאלה"; img.loading = "lazy"; c.append(img); }
  if (it.type === "mc" && it.options) {
    const ol = el("ol", "options");
    it.options.forEach((o, i) => {
      const li = el("li", i === it.correct ? "correct" : "");
      li.append(el("span", "letter", LETTERS[i] + "."), el("span", "", o));
      ol.append(li);
    });
    c.append(ol);
  }
  if (it.notes) c.append(el("div", "note", "הערה שמוצגת לסטודנט: " + it.notes));
  const sol = el("section", "solution");
  sol.append(el("ol", "", it.steps.map(s => `<li>${s}</li>`).join("")));
  if (it.answer) sol.append(el("div", "answer", "תשובה: " + it.answer));
  c.append(sol);
  const claude = el("div", "claude"); claude.hidden = true; c.append(claude);

  const actions = el("div", "actions");
  const btns = ["ok", "problem", "unsure"].map(s => {
    const b = el("button", "act", { ok: "✓ תקין", problem: "✗ יש בעיה", unsure: "? לא בטוח" }[s]);
    b.type = "button"; b.dataset.s = s; b.disabled = !db;
    b.addEventListener("click", () => save(it.id, { status: s }));
    return b;
  });
  const saved = el("span", "saved");
  actions.append(...btns, saved);
  c.append(actions);
  const ta = el("textarea");
  ta.id = "c-" + it.id; ta.placeholder = "הערה: מה לא בסדר ובאיזו שורה (לא חובה כשהפתרון תקין)"; ta.disabled = !db;
  ta.setAttribute("aria-label", "הערה לשאלה " + it.number);
  let timer = null;
  ta.addEventListener("input", () => {
    clearTimeout(timer); saved.textContent = "";
    timer = setTimeout(() => save(it.id, { comment: ta.value }), 900);
  });
  c.append(ta);
  c._refs = { btns, saved, ta, claude };
  cards.set(it.id, c);
  paint(it.id);
  return c;
}

// Reflect the stored review on a card already on screen, without rebuilding it (keeps typeset math).
function paint(id) {
  const c = cards.get(id); if (!c) return;
  const r = reviews[id] || {}, s = statusOf(id), { btns, ta, claude } = c._refs;
  c.dataset.status = s;
  btns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === s)));
  if (document.activeElement !== ta && (r.comment || "") !== ta.value) ta.value = r.comment || "";
  const note = r.claudeNote || r.generalNote || (BY_ID.get(id) || {}).generalNote;
  claude.hidden = !note;
  if (note) {
    claude.innerHTML = `<b>${r.claudeNote ? "תוקן על ידי Claude, לבדיקה חוזרת" : "עודכן לפי ההערה הכללית שלך"}</b>${note}`;
    // MathJax can't measure detached nodes (it renders huge glyphs); a new card is typeset with its chunk.
    if (c.isConnected) typeset(claude);
  }
}

async function save(id, patch) {
  if (!db) return;
  const c = cards.get(id), saved = c && c._refs.saved;
  const prev = writing.get(id) || Promise.resolve();
  const next = prev.then(async () => {
    const cur = reviews[id] || {};
    const body = { status: cur.status || "unsure", comment: cur.comment || "", at: new Date().toISOString(), ...patch };
    if (cur.claudeNote) body.claudeNote = cur.claudeNote;
    if (cur.generalNote) body.generalNote = cur.generalNote;
    reviews[id] = body; paint(id); renderProgress();
    try { await db.collection("reviews").doc(id).set(body); if (saved) saved.textContent = "נשמר"; }
    catch (e) { if (saved) saved.textContent = "השמירה נכשלה, נסו שוב"; }
  });
  writing.set(id, next.catch(() => {}));
  return next;
}

let shown = 0, current = [];
function renderList() {
  cards.clear(); shown = 0;
  current = ITEMS.filter(matches);
  $("count").textContent = `מוצגים ${current.length}`;
  const list = $("list");
  list.replaceChildren();
  if (!current.length) { list.append(el("p", "empty", "אין פתרונות במצב הזה. בחרו מצב או נושא אחר.")); return; }
  page();
}
function page() {
  const list = $("list");
  const old = list.querySelector(".more"); if (old) old.remove();
  const chunk = el("div", "wrap"); chunk.style.padding = "0";
  current.slice(shown, shown + PAGE).forEach(it => chunk.append(card(it)));
  shown = Math.min(current.length, shown + PAGE);
  list.append(chunk); typeset(chunk);
  if (shown < current.length) {
    const more = el("button", "more", `הצג עוד (${current.length - shown} נותרו)`);
    more.type = "button"; more.addEventListener("click", page); list.append(more);
  }
}

$("f-status").addEventListener("change", renderList);
$("f-topic").addEventListener("change", renderList);
renderProgress();
$("list").append(el("p", "empty", "טוען את הסימונים שלך…"));
let rendered = false;
const firstRender = () => { if (!rendered) { rendered = true; renderList(); } };
setTimeout(firstRender, 6000);  // don't leave the page empty if the store is slow to answer

(async () => {
  db = window.claude ? await window.claude.use("db") : null;
  if (!db) { $("banner").hidden = false; firstRender(); return; }
  document.querySelectorAll(".act, textarea").forEach(b => { b.disabled = false; });
  let first = true;
  db.collection("reviews").onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      if (ch.type === "removed") delete reviews[ch.doc.id];
      else reviews[ch.doc.id] = { ...ch.doc.data() };
      paint(ch.doc.id);
    });
    renderProgress();
    if (first) { first = false; firstRender(); }  // the default "not reviewed yet" filter needs the stored reviews
  }, () => { $("banner").hidden = false; firstRender(); });
})();
</script>
